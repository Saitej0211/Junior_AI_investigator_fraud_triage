<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Review</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Morning triage</h1>
    <div id="counts" class="counts"></div>
  </header>
  <main>
    <div id="alerts"></div>
    <div id="error" class="error" hidden></div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Case</th><th>Tier</th><th>Score</th><th>AI assessment</th><th>Top signals</th></tr>
      </thead>
      <tbody id="queue"></tbody>
    </table>
    </div>
    <!-- TODO (step 3): queue cards, filters, bulk-accept for Low -->
    <!-- TODO (step 4): accept/override and notes in the case panel -->
  </main>
  <dialog id="case" class="drawer">
    <div class="drawer-head">
      <h2 id="case-title"></h2>
      <button id="case-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="case-body"></div>
    <section class="ask">
      <h3>Ask about this case</h3>
      <div id="suggestions" class="suggestions"></div>
      <div id="thread" class="thread"></div>
      <form id="ask-form">
        <input id="ask-input" autocomplete="off" maxlength="1000"
               placeholder="e.g. Why is the distance a concern?">
        <button type="submit">Ask</button>
      </form>
    </section>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
